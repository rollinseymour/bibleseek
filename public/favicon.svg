<?xml version="1.0" encoding="UTF-8"?>
<!--
  Simplified brand mark for small contexts (browser tab favicon, nav
  bar, footer). The full app icon (open Bible + magnifying glass +
  crucifix) is too detailed at 16-32 px, so we extract its signifying
  element: a magnifying glass with a cross inside the lens. Pure SVG
  so it stays crisp at any size.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
>
  <!-- Tile background, brand brown -->
  <rect width="32" height="32" rx="7" fill="#7A5A2D" />

  <!-- Magnifying glass: lens centered upper-left, handle to bottom-right -->
  <g
    fill="none"
    stroke="#FAF7F0"
    stroke-width="2"
    stroke-linecap="round"
  >
    <circle cx="13" cy="13" r="6" />
    <line x1="17.5" y1="17.5" x2="24" y2="24" />
  </g>

  <!-- Cross inside the lens -->
  <g fill="#FAF7F0">
    <rect x="12.25" y="9" width="1.5" height="8" rx="0.3" />
    <rect x="10.5" y="11.5" width="5" height="1.5" rx="0.3" />
  </g>
</svg>
