<?xml version="1.0" encoding="UTF-8"?>
<!--
  Brand mark — cream "B" on a brown rounded square. Mirrors the Nav
  logo so a pinned tab and the page header read as the same identity.
  Pure SVG, no external font; the glyph picks up the user's installed
  serif so it stays legible at any size.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
>
  <rect width="32" height="32" rx="7" fill="#7A5A2D" />
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    fill="#FAF7F0"
  >B</text>
</svg>
