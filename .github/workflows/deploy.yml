name: Deploy to GitHub Pages

# Build & deploy whenever main is updated, plus a manual trigger from
# the Actions tab in case you want to redeploy without pushing a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy job needs to publish to Pages and to mint the
# OIDC token GitHub uses to verify the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land back-to-back, queue the second one rather than
# letting it race the first. `cancel-in-progress: false` keeps an
# already-running deploy from being killed mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The marketing site (Astro) → dist/
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the engines.node range in package.json (>=22.12.0).
          node-version: 22
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Build the site
        run: npm run build

      # The web reader (Flutter, in app/) → dist/read/
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Build the web reader
        working-directory: app
        run: flutter build web --release --base-href /read/ --no-wasm-dry-run
      - name: Add the reader to the site
        run: cp -R app/build/web dist/read

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
