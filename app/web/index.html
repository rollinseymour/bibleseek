<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; the site serves the app under /read/. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read the Bible in your browser with Bible Seek — KJV, ASV, BSB and WEB, with highlights, notes, bookmarks and favorites.">
  <meta name="theme-color" content="#0F0F0F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bible Seek">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Bible Seek Reader</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F0F0F; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #9E9E9E; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #loading img { width: 88px; height: 88px; border-radius: 20px; }
    #loading .bar { width: 120px; height: 3px; border-radius: 2px; background: #2C2C2C; overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #53DFB8;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading Bible Seek">
    <img src="icons/Icon-192.png" alt="">
    <div>Bible Seek</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
