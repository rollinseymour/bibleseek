name: bibleseek_web
description: "Bible Seek web reader, served at bibleseekapp.com/read/."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  http: ^1.6.0
  # pdf 3.12 caps archive below 4.1, which image 4.11+ needs; pdf 3.13 needs Dart 3.12.
  image: ">=4.5.0 <4.11.0"
  pdf: ^3.12.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
